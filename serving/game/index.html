<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gap Glider</title>
  <style>
    :root { --bg: #0b0c0a; --panel: #141612; --ink: #f3f3ef; --muted: #9a9d94; --accent: #c5f82a; --red: #ff6b5b; --blue: #5ab4dc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    main { display: flex; gap: 24px; padding: 20px; justify-content: center; flex-wrap: wrap; }
    canvas { background: #0f110d; border: 1px solid #2a2d26; border-radius: 10px; width: 420px; height: 560px; max-width: 100%; }
    aside { width: 420px; max-width: 100%; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 22px; } h1 span { color: var(--accent); }
    .box { background: var(--panel); border: 1px solid #2a2d26; border-radius: 10px; padding: 12px 14px; }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    input, select, button { font: inherit; color: var(--ink); background: #1c1f19; border: 1px solid #33372f; border-radius: 6px; padding: 6px 8px; }
    input { width: 100%; } button { cursor: pointer; } button.primary { background: var(--accent); color: var(--bg); border: none; font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stats b { display: block; font-size: 20px; } .stats small { color: var(--muted); }
    .bar { display: grid; grid-template-columns: 52px 1fr 48px; gap: 8px; align-items: center; margin: 4px 0; }
    .bar div { height: 14px; background: var(--blue); border-radius: 3px; width: 0; transition: width .08s; }
    .bar.chosen div { background: var(--accent); }
    pre { white-space: pre-wrap; margin: 0; font: 12.5px/1.4 ui-monospace, Menlo, monospace; color: #d8dbd2; }
    #status { color: var(--muted); font-size: 13px; min-height: 18px; } #status.error { color: var(--red); }
  </style>
</head>
<body>
<main>
  <canvas id="game" width="420" height="560"></canvas>
  <aside>
    <h1>Gap <span>Glider</span>, played by a decision model</h1>
    <div class="box">
      <label for="endpoint">Endpoint (printed by <code>modal serve -m serving.server</code>)</label>
      <input id="endpoint" placeholder="https://…modal.run">
      <div class="row" style="margin-top:10px">
        <select id="mode">
          <option value="plain">Model, plain facts</option>
          <option value="hinted">Model, with planner hints</option>
          <option value="human">Human (space bar)</option>
        </select>
        <button id="start" class="primary">Start</button>
        <button id="stop">Stop</button>
        <label hidden><input id="shield" type="checkbox" checked> shield</label><!-- hidden: the shield stays on -->
      </div>
      <div id="status"></div>
    </div>
    <div class="box stats">
      <div><b id="score">0</b><small>score</small></div>
      <div><b id="best">0</b><small>best</small></div>
      <div><b id="crashes">0</b><small>crashes</small></div>
      <div><b id="decisions">0</b><small>decisions</small></div>
      <div><b id="server-ms">–</b><small>server ms</small></div>
      <div><b id="trip-ms">–</b><small>round trip ms</small></div>
      <div hidden><b id="agreement">–</b><small>planner agreement</small></div>
      <div hidden><b id="interventions">0</b><small>shield saves</small></div>
    </div>
    <div class="box">
      <label>Model's probabilities</label>
      <div class="bar" id="bar-flap"><span>flap</span><div></div><span>–</span></div>
      <div class="bar" id="bar-glide"><span>glide</span><div></div><span>–</span></div>
    </div>
    <div class="box">
      <label>What the model reads</label>
      <pre id="prompt">Press Start.</pre>
    </div>
  </aside>
</main>
<script src="game.js"></script>
</body>
</html>
